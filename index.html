<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ことば なぞり</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"UD Digi Kyokasho N-R","BIZ UDPGothic","Yu Gothic",sans-serif;background:#edf2f6;color:#24323c}
button{font-family:inherit}.screen{position:absolute;inset:0}.hidden{display:none!important}
#titleScreen{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#f4f8fb,#dfeaf2)}
.titleCard{width:min(90vw,720px);padding:34px 30px 38px;background:#fff;border-radius:30px;box-shadow:0 14px 40px #0002;text-align:center}
.titleCard h1{margin:0 0 12px;font-size:clamp(34px,6vw,58px);letter-spacing:.04em}.titleCard p{margin:0 0 28px;font-size:clamp(18px,3vw,26px);font-weight:800;color:#667784}
.modeButtons{display:grid;grid-template-columns:1fr 1fr;gap:18px}.modeBtn{min-height:120px;border:0;border-radius:24px;color:#fff;font-size:clamp(28px,4vw,42px);font-weight:900;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.modeBtn:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.12)}.modeBtn.hira{background:#df6f77}.modeBtn.kata{background:#527fb9}
#gameScreen{background:#fff;display:grid;grid-template-rows:47% 53%}.imageArea{position:relative;display:flex;align-items:center;justify-content:center;background:#e7eef4;border-bottom:3px solid #d8e1e8;overflow:hidden}
.imageFrame{position:relative;width:min(84%,680px);height:88%;border-radius:26px;background:#dce5eb;overflow:hidden;box-shadow:0 8px 28px #0002}#sourceImage{display:none}#effectCanvas{width:100%;height:100%;display:block}
.imageFallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:#f6f9fb;color:#73818b;font-size:18px;font-weight:800;line-height:1.6;white-space:pre-line}.imageFallback.hidden{display:none}
.topBar{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.topBar button{pointer-events:auto;border:0;border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.9);font-weight:900;color:#32424e;box-shadow:0 2px 10px #0002;cursor:pointer}.problemCount{background:rgba(255,255,255,.88);border-radius:999px;padding:8px 13px;font-weight:900;color:#53636f}
.traceArea{min-height:0;display:grid;grid-template-rows:1fr auto;padding:8px 14px 9px}.wordStage{min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2px 6px}.wordLine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:clamp(3px,.8vw,10px)}
.charSlot{flex:0 0 auto;height:100%;display:flex;align-items:center;justify-content:flex-start;position:relative}.charSlot.small{align-items:flex-end}.charSvg{display:block;touch-action:none;user-select:none;-webkit-user-select:none;overflow:visible}.charSlot:not(.small) .charSvg{width:100%;height:100%}.charSlot.small .charSvg{width:100%;height:72%;align-self:flex-end}
.guidePart{fill:#dfe4ea}.donePart,.currentDarkPart{fill:#35434d}.startDot{fill:#ffd54f;stroke:#8a6a00;stroke-width:7}.startRing{fill:none;stroke:#ffb300;stroke-width:9;animation:pulse 1s infinite}.startNum{font-size:46px;font-weight:900;text-anchor:middle;dominant-baseline:middle;pointer-events:none}@keyframes pulse{0%,100%{opacity:.28}50%{opacity:1}}.runner{font-size:86px;text-anchor:middle;dominant-baseline:middle;pointer-events:none;filter:drop-shadow(0 5px 3px #0004)}
.bottomBar{min-height:42px;display:flex;align-items:center;justify-content:center;gap:10px}.bottomBar button{border:0;border-radius:14px;padding:9px 17px;background:#26384f;color:#fff;font-weight:900;font-size:16px;cursor:pointer}.message{min-width:160px;text-align:center;font-size:18px;font-weight:900;color:#52616b}
.completeOverlay{position:absolute;inset:0;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;z-index:20}.completeCard{padding:30px 34px;background:#fff;border-radius:26px;text-align:center;box-shadow:0 12px 34px #0003}.completeWord{font-size:clamp(44px,7vw,76px);font-weight:900;margin-bottom:20px}.completeCard button{border:0;border-radius:18px;padding:14px 28px;background:#26384f;color:#fff;font-size:24px;font-weight:900;cursor:pointer}
@media(max-width:700px){.modeButtons{grid-template-columns:1fr}.modeBtn{min-height:90px}.imageFrame{width:90%}}

/* ===== ゲーム進行 v4 ===== */
.titleStep.hidden{display:none!important}
.timeButtons{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.timeBtn{
  min-height:112px;border:0;border-radius:24px;color:#fff;
  font-size:clamp(24px,3.5vw,36px);font-weight:900;cursor:pointer;
  box-shadow:0 8px 0 rgba(0,0,0,.12)
}
.timeBtn:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.timeBtn.noLimit{background:#45a56b}
.timeBtn.timed{background:#ef8b3d}
.backMode{
  margin-top:18px;border:0;background:transparent;color:#687a87;
  font-size:18px;font-weight:900;cursor:pointer
}

.topBar{
  justify-content:flex-end!important;
  gap:10px;
}
.timerBox{
  width:min(31vw,220px);
  background:rgba(255,255,255,.93);
  border-radius:999px;
  padding:7px 10px;
  box-shadow:0 2px 10px #0002;
}
.timerRow{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;font-size:15px;font-weight:900;color:#3c4b56
}
.timerTrack{
  margin-top:4px;height:9px;border-radius:999px;
  overflow:hidden;background:#dfe6eb
}
.timerFill{
  width:100%;height:100%;border-radius:999px;
  background:#f39a3d;transform-origin:left center
}
.timerBox.hidden{display:none!important}

.bottomBar{min-height:30px}
.message{font-size:16px}

/* 正解後：背景は一切覆わない */
.successLayer{
  position:absolute;inset:0;z-index:30;
  pointer-events:none;overflow:hidden
}
.nextFloat{
  position:absolute;left:50%;top:49%;
  transform:translate(-50%,-50%) scale(.9);
  pointer-events:auto;
  border:0;border-radius:18px;
  padding:11px 24px;
  background:#26384f;color:#fff;
  font-size:21px;font-weight:900;
  box-shadow:0 7px 18px #0004;
  opacity:0;
  transition:opacity .18s ease,transform .18s ease;
}
.nextFloat.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.starParticle{
  position:absolute;left:50%;top:50%;
  font-size:var(--size);
  transform:translate(-50%,-50%);
  animation:starBurst var(--dur) cubic-bezier(.12,.7,.18,1) forwards;
  filter:drop-shadow(0 2px 2px #0004)
}
@keyframes starBurst{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(0deg)}
  12%{opacity:1}
  100%{
    opacity:0;
    transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)))
              scale(1.15) rotate(var(--rot))
  }
}

/* 時間切れ */
.timeoutLayer{
  position:absolute;inset:0;z-index:35;
  pointer-events:none;overflow:hidden
}
.boomCore{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(.2);
  font-size:clamp(100px,18vw,210px);
  animation:boomCore .7s ease-out forwards;
  filter:drop-shadow(0 8px 8px #0005)
}
.boomParticle{
  position:absolute;left:50%;top:50%;
  width:var(--size);height:var(--size);
  border-radius:50%;
  background:var(--c);
  animation:boomParticle .72s ease-out forwards;
}
@keyframes boomCore{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(-12deg)}
  28%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(8deg)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.6) rotate(15deg)}
}
@keyframes boomParticle{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2)}
}
.screenShake{animation:screenShake .5s linear}
@keyframes screenShake{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(-8px,4px)}
  30%{transform:translate(8px,-5px)}
  45%{transform:translate(-6px,-3px)}
  60%{transform:translate(7px,4px)}
  75%{transform:translate(-4px,2px)}
}

/* 問題切替：ランダムムービー風 */
.transitionLayer{
  position:absolute;inset:0;z-index:50;
  pointer-events:none;overflow:hidden;
  display:none
}
.transitionLayer.active{display:block}
.transitionStrip{
  position:absolute;background:#fff;
  box-shadow:0 0 22px #0002
}
.t-sweep .transitionStrip{
  top:0;bottom:0;width:18%;transform:translateX(-130vw) skewX(-12deg);
  animation:sweepStrip .72s ease-in-out forwards
}
.t-sweep .transitionStrip:nth-child(1){left:-10%;animation-delay:0s}
.t-sweep .transitionStrip:nth-child(2){left:7%;animation-delay:.035s}
.t-sweep .transitionStrip:nth-child(3){left:24%;animation-delay:.07s}
.t-sweep .transitionStrip:nth-child(4){left:41%;animation-delay:.105s}
.t-sweep .transitionStrip:nth-child(5){left:58%;animation-delay:.14s}
.t-sweep .transitionStrip:nth-child(6){left:75%;animation-delay:.175s}
.t-sweep .transitionStrip:nth-child(7){left:92%;animation-delay:.21s}
@keyframes sweepStrip{
  0%{transform:translateX(-130vw) skewX(-12deg)}
  48%{transform:translateX(0) skewX(-12deg)}
  58%{transform:translateX(0) skewX(-12deg)}
  100%{transform:translateX(130vw) skewX(-12deg)}
}

.t-shutter .transitionStrip{
  left:0;width:100%;height:15%;transform:scaleX(0);
  animation:shutterStrip .68s ease-in-out forwards
}
.t-shutter .transitionStrip:nth-child(1){top:0}
.t-shutter .transitionStrip:nth-child(2){top:14.3%;animation-delay:.025s}
.t-shutter .transitionStrip:nth-child(3){top:28.6%;animation-delay:.05s}
.t-shutter .transitionStrip:nth-child(4){top:42.9%;animation-delay:.075s}
.t-shutter .transitionStrip:nth-child(5){top:57.2%;animation-delay:.1s}
.t-shutter .transitionStrip:nth-child(6){top:71.5%;animation-delay:.125s}
.t-shutter .transitionStrip:nth-child(7){top:85.8%;animation-delay:.15s}
@keyframes shutterStrip{
  0%{transform:scaleX(0)}
  45%{transform:scaleX(1)}
  60%{transform:scaleX(1)}
  100%{transform:scaleX(0)}
}

.t-iris{background:#fff;clip-path:circle(0% at 50% 50%);animation:iris .72s ease-in-out forwards}
.t-iris .transitionStrip{display:none}
@keyframes iris{
  0%{clip-path:circle(0% at 50% 50%)}
  48%{clip-path:circle(75% at 50% 50%)}
  58%{clip-path:circle(75% at 50% 50%)}
  100%{clip-path:circle(0% at 50% 50%)}
}

.t-diagonal{background:#fff;transform:translate(-120%,-120%) rotate(18deg) scale(1.8);animation:diagonal .72s ease-in-out forwards}
.t-diagonal .transitionStrip{display:none}
@keyframes diagonal{
  0%{transform:translate(-120%,-120%) rotate(18deg) scale(1.8)}
  48%{transform:translate(0,0) rotate(18deg) scale(1.8)}
  58%{transform:translate(0,0) rotate(18deg) scale(1.8)}
  100%{transform:translate(120%,120%) rotate(18deg) scale(1.8)}
}

.t-zoom{background:#fff;opacity:0;transform:scale(.15);border-radius:50%;animation:zoomTrans .68s ease-in-out forwards}
.t-zoom .transitionStrip{display:none}
@keyframes zoomTrans{
  0%{opacity:0;transform:scale(.15);border-radius:50%}
  43%{opacity:1;transform:scale(1.5);border-radius:0}
  60%{opacity:1;transform:scale(1.5);border-radius:0}
  100%{opacity:0;transform:scale(2.1);border-radius:0}
}

/* 10問終了 */
#clearScreen{
  z-index:80;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#fff9d9,#e6f6ff)
}
.clearCard{
  text-align:center;padding:36px 48px;
  border-radius:32px;background:#fff;
  box-shadow:0 15px 45px #0002
}
.clearStars{font-size:clamp(42px,8vw,82px);letter-spacing:.08em}
.clearTitle{font-size:clamp(42px,7vw,72px);font-weight:900;margin-top:10px}
.clearSub{font-size:clamp(20px,3vw,28px);font-weight:900;color:#6a7881;margin-top:10px}

@media(max-width:700px){
  .timeButtons{grid-template-columns:1fr}
  .timeBtn{min-height:82px}
}


.againBtn{
  margin-top:24px;border:0;border-radius:20px;
  padding:14px 30px;background:#26384f;color:#fff;
  font-size:24px;font-weight:900;cursor:pointer;
  box-shadow:0 7px 0 rgba(0,0,0,.15)
}
.againBtn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.15)}

.boomCore{
  font-size:clamp(190px,42vw,520px)!important;
}
.boomParticle{
  box-shadow:0 0 18px currentColor;
}
.boomRing{
  position:absolute;left:50%;top:50%;
  width:18vmin;height:18vmin;border-radius:50%;
  border:5vmin solid rgba(255,175,20,.78);
  transform:translate(-50%,-50%) scale(.15);
  animation:boomRing .86s ease-out forwards;
}
@keyframes boomRing{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.12)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(5.6)}
}
.miniBoom{
  position:absolute;
  font-size:clamp(60px,10vw,130px);
  transform:translate(-50%,-50%) scale(.15);
  animation:miniBoom .7s ease-out forwards;
  filter:drop-shadow(0 5px 5px #0004)
}
@keyframes miniBoom{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.15)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}
}


/* ===== ハードモード追加 ===== */
.difficultyButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.difficultyBtn{
  min-height:112px;
  border:0;
  border-radius:24px;
  color:#fff;
  font-size:clamp(25px,3.6vw,38px);
  font-weight:900;
  cursor:pointer;
  box-shadow:0 8px 0 rgba(0,0,0,.12);
}
.difficultyBtn:active{
  transform:translateY(4px);
  box-shadow:0 4px 0 rgba(0,0,0,.12);
}
.difficultyBtn.normal{background:#4c91d7}
.difficultyBtn.hard{background:#e5574f}

.hardMissLayer{
  position:absolute;
  inset:0;
  z-index:34;
  pointer-events:none;
  overflow:hidden;
}
.hardMissBoom{
  position:absolute;
  transform:translate(-50%,-50%) scale(.1);
  font-size:clamp(90px,15vw,170px);
  filter:drop-shadow(0 6px 7px #0005);
  animation:hardMissBoom .58s ease-out forwards;
}
@keyframes hardMissBoom{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.1) rotate(-15deg)}
  24%{opacity:1;transform:translate(-50%,-50%) scale(1.16) rotate(8deg)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.55) rotate(18deg)}
}
.hardMissParticle{
  position:absolute;
  width:var(--size);
  height:var(--size);
  border-radius:50%;
  background:var(--c);
  box-shadow:0 0 12px var(--c);
  animation:hardMissParticle .58s ease-out forwards;
}
@keyframes hardMissParticle{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}
  100%{
    opacity:0;
    transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15)
  }
}

@media(max-width:700px){
  .difficultyButtons{grid-template-columns:1fr}
  .difficultyBtn{min-height:82px}
}

</style>
</head>
<body>
<section id="titleScreen" class="screen">
  <div class="titleCard">
    <div id="scriptStep" class="titleStep">
      <h1>ことば なぞり</h1>
      <p>どっちで かく？</p>
      <div class="modeButtons">
        <button class="modeBtn hira" data-script="hira" type="button">ひらがな</button>
        <button class="modeBtn kata" data-script="kata" type="button">カタカナ</button>
      </div>
    </div>
    <div id="difficultyStep" class="titleStep hidden">
      <h1>むずかしさを えらぼう</h1>
      <p>どっちで やる？</p>
      <div class="difficultyButtons">
        <button class="difficultyBtn normal" data-difficulty="normal" type="button">ノーマル</button>
        <button class="difficultyBtn hard" data-difficulty="hard" type="button">ハード</button>
      </div>
      <button id="backScript" class="backMode" type="button">← もどる</button>
    </div>
    <div id="timeStep" class="titleStep hidden">
      <h1>モードを えらぼう</h1>
      <p>じかんせいげんは？</p>
      <div class="timeButtons">
        <button class="timeBtn noLimit" data-timed="no" type="button">なし</button>
        <button class="timeBtn timed" data-timed="yes" type="button">あり<br><span style="font-size:.68em">1もじ 15びょう</span></button>
      </div>
      <button id="backMode" class="backMode" type="button">← もどる</button>
    </div>
  </div>
</section>
<section id="gameScreen" class="screen hidden">
  <div class="imageArea">
    <div class="imageFrame">
      <img id="sourceImage" alt="">
      <canvas id="effectCanvas"></canvas>
      <div id="imageFallback" class="imageFallback hidden"></div>
    </div>
    <div class="topBar">
      <div id="timerBox" class="timerBox hidden">
        <div class="timerRow"><span>のこり</span><span id="timerText">30</span></div>
        <div class="timerTrack"><div id="timerFill" class="timerFill"></div></div>
      </div>
      <div id="problemCount" class="problemCount"></div>
    </div>
  </div>
  <div class="traceArea">
    <div class="wordStage"><div id="wordLine" class="wordLine"></div></div>
    <div class="bottomBar"><div id="message" class="message"></div></div>
  </div>

  <div id="successLayer" class="successLayer hidden">
    <button id="nextBtn" class="nextFloat" type="button">つぎへ</button>
  </div>
  <div id="timeoutLayer" class="timeoutLayer hidden"></div>
  <div id="hardMissLayer" class="hardMissLayer hidden"></div>

  <div id="transitionLayer" class="transitionLayer">
    <div class="transitionStrip"></div><div class="transitionStrip"></div>
    <div class="transitionStrip"></div><div class="transitionStrip"></div>
    <div class="transitionStrip"></div><div class="transitionStrip"></div>
    <div class="transitionStrip"></div>
  </div>
</section>
<section id="clearScreen" class="screen hidden">
  <div class="clearCard">
    <div class="clearStars">⭐ ⭐ ⭐</div>
    <div class="clearTitle">10もん クリア！</div>
    <div class="clearSub">よく がんばりました！</div>
    <button id="againBtn" class="againBtn" type="button">もういちど</button>
  </div>
</section>
<script src="problems.js"></script>
<script>
(() => {
  const PROBLEMS = window.PROBLEMS || [];
  const SESSION_COUNT = 10;
  const TIME_PER_CHAR_SECONDS = 15;
  const TRANSITIONS = ["sweep","shutter","iris","diagonal","zoom"];
  const EFFECTS = ["mosaic","sand","wave","tvnoise","rainbow"]; // 各20%
  const HIRAGANA_BASE = "https://cdn.jsdelivr.net/npm/kana-svg-data/dist/hiragana/";
  const KATAKANA_BASE = "https://cdn.jsdelivr.net/npm/kana-svg-data/dist/katakana/";
  const SMALL_MAP = {"ゃ":"や","ゅ":"ゆ","ょ":"よ","っ":"つ","ャ":"ヤ","ュ":"ユ","ョ":"ヨ","ッ":"ツ","ァ":"ア","ィ":"イ","ゥ":"ウ","ェ":"エ","ォ":"オ"};
  const SMALL_SET = new Set(Object.keys(SMALL_MAP));
  const SPECIAL_DATA = {"ー":{strokes:{"1":"M180 490 C360 485 665 485 844 490 C865 491 875 513 861 528 C845 546 819 546 793 544 C602 538 411 539 220 544 C196 545 173 537 165 520 C157 505 165 492 180 490Z"},logicalStrokes:[{shapeIds:["1"],median:[[185,515],[420,515],[650,515],[840,515]]}]}};
  const cache = new Map(), NS = "http://www.w3.org/2000/svg";
  const CENTER_FALLBACK_RADIUS=92, START_RADIUS=105, RECOVERY_RADIUS=105, HARD_EXPLODE_RADIUS=130, FORWARD_WINDOW=165, BACK_WINDOW=26, SAMPLE_STEP=7, COMPLETE_MARGIN=14;

  const titleScreen=document.getElementById("titleScreen"),
        scriptStep=document.getElementById("scriptStep"),
        difficultyStep=document.getElementById("difficultyStep"),
        timeStep=document.getElementById("timeStep"),
        backScript=document.getElementById("backScript"),
        backMode=document.getElementById("backMode"),
        gameScreen=document.getElementById("gameScreen"),
        clearScreen=document.getElementById("clearScreen"),
        againBtn=document.getElementById("againBtn"),
        wordLine=document.getElementById("wordLine"),
        nextBtn=document.getElementById("nextBtn"),
        successLayer=document.getElementById("successLayer"),
        timeoutLayer=document.getElementById("timeoutLayer"),
        hardMissLayer=document.getElementById("hardMissLayer"),
        transitionLayer=document.getElementById("transitionLayer"),
        timerBox=document.getElementById("timerBox"),
        timerText=document.getElementById("timerText"),
        timerFill=document.getElementById("timerFill"),
        messageEl=document.getElementById("message"),
        problemCount=document.getElementById("problemCount"),
        sourceImage=document.getElementById("sourceImage"),
        effectCanvas=document.getElementById("effectCanvas"),
        imageFallback=document.getElementById("imageFallback"),
        ctx=effectCanvas.getContext("2d");

  let mode="hira",
      difficultyMode="normal",
      timedMode=false,
      sessionProblems=[],
      sessionPos=0,
      problemIndex=0,
      effectName="mosaic",
      word="",
      chars=[],
      charData=[],
      currentCharIndex=0,
      currentStrokeIndex=0,
      strokeProgress=0,
      tracing=false,
      pointerId=null,
      recoveryWaiting=false,
      finished=false,
      currentUI=null,
      resizeTimer=null,
      imageAvailable=false,
      timerHandle=null,
      timerStartedAt=0,
      timerLocked=false,

    context.beginPath();
    context.arc(-Math.min(W,H)*.08,-Math.min(W,H)*.04,Math.min(W,H)*.025,0,Math.PI*2);
    context.arc(Math.min(W,H)*.08,-Math.min(W,H)*.04,Math.min(W,H)*.025,0,Math.PI*2);
    context.fill();

    context.strokeStyle="#35434d";
    context.lineWidth=Math.max(4,Math.min(W,H)*.012);
    context.lineCap="round";
    context.beginPath();
    context.arc(0,Math.min(W,H)*.03,Math.min(W,H)*.09,.15*Math.PI,.85*Math.PI);
    context.stroke();
    context.restore();

    context.fillStyle="rgba(255,255,255,.82)";
    context.font=`900 ${Math.max(18,Math.round(Math.min(W,H)*.055))}px sans-serif`;
    context.textAlign="center";
    context.fillText("IMAGE",W/2,H*.88);
  }

  function baseImageCanvas(W,H){
    const c=makeOffscreen(W,H),cctx=c.getContext("2d");
    if(imageAvailable && sourceImage.naturalWidth){
      drawImageContain(cctx,sourceImage,0,0,W,H);
    }else{
      drawDemoImage(cctx,W,H);
    }
    return c
  }
  function renderImageEffect(forceClear=false){
    resizeCanvasToFrame();
    const W=effectCanvas.width,H=effectCanvas.height;
    ctx.clearRect(0,0,W,H);

    if(forceClear||currentCharIndex>=chars.length){
      const base=baseImageCanvas(W,H);
      ctx.drawImage(base,0,0);
      return;
    }

    const strength=1-imageProgress();
    ({mosaic:drawMosaic,sand:drawSand,wave:drawWave,tvnoise:drawTvNoise,rainbow:drawRainbowSilhouette}[effectName]||drawMosaic)(W,H,strength)
  }
  function drawMosaic(W,H,strength){const base=baseImageCanvas(W,H),blocks=Math.max(8,Math.round(12+strength*38)),sw=Math.max(1,Math.round(W/blocks)),sh=Math.max(1,Math.round(H/blocks)),small=makeOffscreen(sw,sh);small.getContext("2d").drawImage(base,0,0,sw,sh);ctx.imageSmoothingEnabled=false;ctx.drawImage(small,0,0,sw,sh,0,0,W,H);ctx.imageSmoothingEnabled=true}
  function drawSand(W,H,strength){
    const base=baseImageCanvas(W,H);

    // まず元画像を描く
    ctx.drawImage(base,0,0);

    /*
      今回のサンドストームは「薄くなる」のではなく、
      砂の層に穴が空いていき、見える箇所が増える方式。
    */
    const sand=makeOffscreen(W,H);
    const sctx=sand.getContext("2d");

    // 砂色の地の層
    sctx.fillStyle="#d2b07b";
    sctx.fillRect(0,0,W,H);

    // ざらつき
    let seed=(problemIndex+1)*92821 + chars.length*337 + Math.floor(strength*100)*17;
    const rand=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };

    const grainCount=Math.floor(1300 + strength*2400);
    for(let i=0;i<grainCount;i++){
      const x=rand()*W;
      const y=rand()*H;
      const r=(0.6+rand()*2.8)*(0.6+strength*0.8);
      const alpha=0.08+rand()*0.22;
      const rr=188+Math.floor(rand()*35);
      const gg=145+Math.floor(rand()*35);
      const bb=80+Math.floor(rand()*30);
      sctx.fillStyle=`rgba(${rr},${gg},${bb},${alpha})`;
      sctx.beginPath();
      sctx.arc(x,y,r,0,Math.PI*2);
      sctx.fill();
    }

    // 風の筋
    const streaks=Math.floor(40 + strength*85);
    sctx.save();
    sctx.lineCap="round";
    for(let i=0;i<streaks;i++){
      const x=rand()*W;
      const y=rand()*H;
      const len=(30+rand()*120)*(0.6+strength);
      const thick=1+rand()*4;
      const alpha=0.05+rand()*0.16;
      sctx.strokeStyle=`rgba(${205+Math.floor(rand()*30)},${170+Math.floor(rand()*25)},${110+Math.floor(rand()*20)},${alpha})`;
      sctx.lineWidth=thick;
      sctx.beginPath();
      sctx.moveTo(x,y);
      sctx.lineTo(Math.min(W,x+len), Math.max(0,Math.min(H,y-len*0.12+rand()*18)));
      sctx.stroke();
    }
    sctx.restore();

    // destination-out で「見える穴」を空ける
    sctx.globalCompositeOperation="destination-out";

    // 進行に応じて穴の数と大きさが増える
    const holeFactor=1-strength; // 進むほど大きく
    const holeCount=Math.floor(6 + holeFactor*38);
    for(let i=0;i<holeCount;i++){
      const x=rand()*W;
      const y=rand()*H;
      const rw=(W*(0.05+rand()*0.09))*(0.7+holeFactor*1.9);
      const rh=(H*(0.04+rand()*0.08))*(0.7+holeFactor*1.9);

      const g=sctx.createRadialGradient(x,y,0,x,y,Math.max(rw,rh));
      g.addColorStop(0,"rgba(0,0,0,1)");
      g.addColorStop(0.58,"rgba(0,0,0,0.92)");
      g.addColorStop(1,"rgba(0,0,0,0)");
      sctx.fillStyle=g;

      sctx.beginPath();
      sctx.ellipse(x,y,rw,rh,(rand()-0.5)*0.8,0,Math.PI*2);
      sctx.fill();
    }

    // 完全な穴だけでなく、周辺を少し薄くする帯も入れる
    const softHoles=Math.floor(10 + holeFactor*32);
    for(let i=0;i<softHoles;i++){
      const x=rand()*W;
      const y=rand()*H;
      const rw=(W*(0.03+rand()*0.06))*(0.8+holeFactor*1.4);
      const rh=(H*(0.025+rand()*0.05))*(0.8+holeFactor*1.4);
      sctx.fillStyle=`rgba(0,0,0,${0.16+rand()*0.18})`;
      sctx.beginPath();
      sctx.ellipse(x,y,rw,rh,(rand()-0.5)*0.8,0,Math.PI*2);
      sctx.fill();
    }

    // 上に砂の層を重ねる
    ctx.drawImage(sand,0,0);
  }

function drawWave(W,H,strength){
    const base=baseImageCanvas(W,H);

    /*
      初期は大きく派手に波打たせる。
      1文字完成ごとに strength が下がり、急速に元画像へ近づく。
    */
    const amp1=6 + strength*92;
    const amp2=2 + strength*34;
    const period1=Math.max(54,H/4.4);
    const period2=Math.max(34,H/8.5);
    const slice=2;

    for(let y=0;y<H;y+=slice){
      const s1=Math.sin((y/period1)*Math.PI*2)*amp1;
      const s2=Math.sin((y/period2)*Math.PI*2 + 1.2)*amp2;
      const shift=s1+s2;
      ctx.drawImage(base,0,y,W,slice,shift,y,W,slice);
    }

    // 水面っぽい色味も初期ほど強くする
    ctx.save();
    ctx.globalAlpha=.06+.20*strength;
    const g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,"#74d8ff");
    g.addColorStop(.5,"#b9f1ff");
    g.addColorStop(1,"#4ea7ff");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
    ctx.restore();

    // 静止した明るい波筋
    ctx.save();
    ctx.globalAlpha=.08+.18*strength;
    ctx.strokeStyle="white";
    ctx.lineWidth=Math.max(2,Math.min(W,H)*.006);
    for(let i=0;i<5;i++){
      const yy=H*(.18+i*.16);
      ctx.beginPath();
      for(let x=0;x<=W;x+=12){
        const y2=yy + Math.sin((x/W)*Math.PI*4 + i*.8)*(8+strength*20);
        if(x===0) ctx.moveTo(x,y2); else ctx.lineTo(x,y2);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawTvNoise(W,H,strength){
    const base=baseImageCanvas(W,H);

    // 元画像
    ctx.drawImage(base,0,0);

    /*
      初期は「ほとんど見えない」くらい強いテレビ砂嵐。
      進むにつれてノイズの密度・不透明度が下がり、
      見える部分が増える。
    */
    const noise=makeOffscreen(W,H);
    const nctx=noise.getContext("2d");

    let seed=(problemIndex+1)*6151 + chars.length*1237 + Math.floor(strength*100)*61;
    const rand=()=>{ seed=(seed*1103515245+12345)>>>0; return seed/4294967296; };

    // ベースの暗幕をまず敷く
    nctx.fillStyle=`rgba(10,10,10,${0.18 + strength*0.54})`;
    nctx.fillRect(0,0,W,H);

    // 高密度の白黒ノイズ粒
    const imgData=nctx.createImageData(W,H);
    const data=imgData.data;
    const alphaBase=0.48 + strength*0.42; // 初期はかなり濃い
    for(let i=0;i<data.length;i+=4){
      const v=Math.floor(rand()*255);
      data[i]=v; data[i+1]=v; data[i+2]=v;
      data[i+3]=Math.floor((alphaBase*(0.70+rand()*0.30))*255);
    }
    nctx.putImageData(imgData,0,0);

    // 太めの横縞・乱れ
    const bands=Math.floor(18 + strength*34);
    for(let i=0;i<bands;i++){
      const y=rand()*H;
      const h=1 + rand()*14;
      const bright = rand()>0.5 ? 255 : 0;
      const a=0.10 + rand()*(0.12 + strength*0.18);
      nctx.fillStyle=`rgba(${bright},${bright},${bright},${a})`;
      nctx.fillRect(0,y,W,h);
    }

    // ブロック状のザラつき
    const blocks=Math.floor(25 + strength*65);
    for(let i=0;i<blocks;i++){
      const x=rand()*W;
      const y=rand()*H;
      const w=(8+rand()*28)*(0.7+strength*0.8);
      const h=(5+rand()*18)*(0.7+strength*0.8);
      const bright = rand()>0.55 ? 255 : 25;
      const a=0.08 + rand()*(0.12 + strength*0.14);
      nctx.fillStyle=`rgba(${bright},${bright},${bright},${a})`;
      nctx.fillRect(x,y,w,h);
    }

    // 進行すると見える窓が少しずつ増える
    nctx.globalCompositeOperation="destination-out";
    const revealLevel = 1 - strength;
    const holeCount = Math.floor(1 + revealLevel*10);
    for(let i=0;i<holeCount;i++){
      const x=rand()*W;
      const y=rand()*H;
      const rw=(W*(0.03+rand()*0.08))*(0.7+revealLevel*1.5);
      const rh=(H*(0.03+rand()*0.07))*(0.7+revealLevel*1.5);
      const g=nctx.createRadialGradient(x,y,0,x,y,Math.max(rw,rh));
      g.addColorStop(0,"rgba(0,0,0,0.92)");
      g.addColorStop(0.6,"rgba(0,0,0,0.45)");
      g.addColorStop(1,"rgba(0,0,0,0)");
      nctx.fillStyle=g;
      nctx.beginPath();
      nctx.ellipse(x,y,rw,rh,(rand()-0.5)*0.9,0,Math.PI*2);
      nctx.fill();
    }

    // 画面全体を少し荒らす筋
    nctx.globalCompositeOperation="source-over";
    nctx.strokeStyle=`rgba(255,255,255,${0.03 + strength*0.10})`;
    nctx.lineWidth=Math.max(1, Math.min(W,H)*0.003);
    for(let i=0;i<Math.floor(10 + strength*26);i++){
      const y=rand()*H;
      nctx.beginPath();
      nctx.moveTo(0,y);
      for(let x=0;x<=W;x+=18){
        nctx.lineTo(x, y + (rand()-0.5)*(4 + strength*18));
      }
      nctx.stroke();
    }

    ctx.drawImage(noise,0,0);

    // 受信のズレっぽい色ぶれ
    if(strength > 0.08){
      ctx.save();
      ctx.globalAlpha=0.03 + strength*0.08;
      ctx.globalCompositeOperation="screen";
      ctx.drawImage(base, -14*strength, 0, W, H);
      ctx.restore();
    }
  }

function drawRainbowSilhouette(W,H,strength){const base=baseImageCanvas(W,H);ctx.save();ctx.translate(W/2,H/2);const radius=Math.hypot(W,H),colors=["#ff3b30","#ff9500","#ffcc00","#34c759","#00c7be","#007aff","#5856d6","#af52de"],wedges=32;for(let i=0;i<wedges;i++){const a0=(i/wedges)*Math.PI*2,a1=((i+1)/wedges)*Math.PI*2;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,radius,a0,a1);ctx.closePath();ctx.globalAlpha=.35+.45*strength;ctx.fillStyle=colors[i%colors.length];ctx.fill()}ctx.restore();const silhouette=makeOffscreen(W,H),sctx=silhouette.getContext("2d");sctx.drawImage(base,0,0);sctx.globalCompositeOperation="source-in";const grad=sctx.createLinearGradient(0,0,W,H);colors.forEach((c,i)=>grad.addColorStop(i/(colors.length-1),c));sctx.fillStyle=grad;sctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.98;ctx.drawImage(silhouette,0,0);ctx.restore();ctx.save();ctx.globalAlpha=(1-strength)*.86;ctx.drawImage(base,0,0);ctx.restore()}

  window.addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{layoutSlots();renderImageEffect(currentCharIndex>=chars.length)},100)});
})();
</script>
